baseURL: "https://u1e2k.github.io/blog/"
title: "u1e2k blog"
theme: "PaperMod"
locale: "ja-jp"
defaultContentLanguage: "ja"
paginate: 8

outputs:
  home:
    - HTML
    - RSS
    - JSON

permalinks:
  posts: /:slug/

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    lineNos: true
    lineNumbersInTable: false
    guessSyntax: true

services:
  googleAnalytics:
    id: "G-L45KVY6N4D"

params:
  env: production
  newPostDays: 30
  title: "u1e2k blog"
  description: "フリーランス インフラエンジニア・メディアオペレーター・クリエイター u1e2k の技術備忘録。Proxmox、NixOS、Godot、自作ツール、AI協調開発など。"
  author: "u1e2k"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: true
  UseHugoToc: true

  label:
    text: "u1e2k blog"
    icon: "assets/images/logo.png"
    iconHeight: 28

  homeInfoParams:
    Title: "u1e2k blog"
    Content: "フリーランス インフラエンジニア・メディアオペレーター・クリエイター。Proxmox、NixOS、Godot ゲーム制作、Obsidian 自作ツール、AI 協調開発の記録などを発信しています。"

  cover:
    responsiveImages: true
    linkFullImages: true

  assets:
    favicon: "assets/images/logo.png"
    favicon16x16: "assets/images/logo.png"
    favicon32x32: "assets/images/logo.png"
    apple_touch_icon: "assets/images/logo.png"

  socialIcons:
    - name: github
      url: "https://github.com/u1e2k"
    - name: twitter
      url: "https://x.com/u1e2k"
    - name: note
      title: "note"
      url: "https://note.com/u1e2k"
    - name: other
      title: "LAPRAS"
      url: "https://lapras.com/public/SGDKQTX"

menu:
  main:
    - identifier: posts
      name: 記事一覧
      url: /posts/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 40
    - identifier: search
      name: 検索
      url: /search/
      weight: 50
    - identifier: about
      name: About
      url: /about/
      weight: 60
