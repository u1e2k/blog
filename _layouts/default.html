<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)">

  <title>{{ page.title | escape }} | {{ site.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  {% seo %}

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml">

  <link rel="icon" href="{{ site.baseurl }}/assets/images/logo.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/logo.png">

  {% if jekyll.environment == 'production' %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}

  <!-- Theme detection script (runs before body to prevent flash) -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var root = document.documentElement;
      
      if (theme === 'dark' || (!theme && prefersDark)) {
        root.setAttribute('data-theme', 'dark');
      } else {
        root.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">本文へスキップ</a>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1 class="site-title">
        <a href="{{ site.baseurl }}/" rel="home">
          {% if site.logo %}
            <img src="{{ site.baseurl }}/{{ site.logo }}" alt="" width="30" height="30" style="vertical-align: middle; margin-right: 8px;">
          {% endif %}
          {{ site.name }}
        </a>
      </h1>

      <nav class="site-nav" role="navigation" aria-label="メインナビゲーション">
        <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ site.baseurl }}/">記事一覧</a>
        <a class="nav-link {% if page.url contains '/about' %}active{% endif %}" href="{{ site.baseurl }}/about/">About</a>
        {% include search-lunr.html %}
      </nav>

      <button class="theme-toggle" id="theme-toggle" aria-label="ダークモード切り替え" type="button">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="メニューを開く" aria-expanded="false" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="site-main" id="main-content" role="main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <p class="footer-copyright">
        &copy; {{ site.time | date: "%Y" }} {{ site.name }}
      </p>
      <ul class="footer-links">
        <li><a href="https://github.com/u1e2k" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://github.com/u1e2k/dotfiles" target="_blank" rel="noopener noreferrer">dotfiles</a></li>
        <li><a href="https://github.com/u1e2k/u1e2k.github.io" target="_blank" rel="noopener noreferrer">u1e2k.github.io</a></li>
        <li><a href="https://twitter.com/u1e2k" target="_blank" rel="noopener noreferrer">Twitter</a></li>
        <li><a href="{{ site.baseurl }}/feed.xml" class="footer-rss" aria-label="RSS フィード">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11a9 9 0 0 1 9 9"></path>
            <path d="M4 4a16 16 0 0 1 16 16"></path>
            <circle cx="5" cy="19" r="1"></circle>
          </svg>
          RSS
        </a></li>
      </ul>
    </div>
  </footer>

  <script>
    // Theme toggle functionality
    (function() {
      var toggle = document.getElementById('theme-toggle');
      var root = document.documentElement;
      var sunIcon = toggle.querySelector('.icon-sun');
      var moonIcon = toggle.querySelector('.icon-moon');

      function updateIcons(theme) {
        if (theme === 'dark') {
          sunIcon.style.display = 'block';
          moonIcon.style.display = 'none';
        } else {
          sunIcon.style.display = 'none';
          moonIcon.style.display = 'block';
        }
      }

      // Initialize
      var currentTheme = root.getAttribute('data-theme');
      updateIcons(currentTheme);

      toggle.addEventListener('click', function() {
        var newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcons(newTheme);
      });

      // Listen for system preference changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
          var newTheme = e.matches ? 'dark' : 'light';
          root.setAttribute('data-theme', newTheme);
          updateIcons(newTheme);
        }
      });
    })();

    // Mobile menu toggle
    (function() {
      var btn = document.getElementById('mobile-menu-btn');
      var nav = document.querySelector('.site-nav');
      
      if (btn && nav) {
        btn.addEventListener('click', function() {
          var isOpen = nav.classList.toggle('open');
          btn.setAttribute('aria-expanded', isOpen);
          btn.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
        });
      }
    })();
  </script>

  <style>
    /* Skip link */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      padding: var(--space-sm) var(--space-md);
      background: var(--color-accent);
      color: var(--color-accent-text);
      border-radius: var(--radius-md);
      z-index: 1000;
      text-decoration: none;
      font-weight: 600;
    }
    .skip-link:focus {
      top: var(--space-md);
    }

    /* Theme toggle icons */
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  </style>
</body>
</html>
