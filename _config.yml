# Site
name: "u1e2k blog"
title: "u1e2k blog"
description: "ソフトウェアエンジニアの備忘録。Nix、Linux、Web 開発、インフラなど。"
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'
url: "https://u1e2k.github.io"
baseurl: "/blog"
google_analytics: 'G-L45KVY6N4D'
disqus: false
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  u1e2k:
    name: u1e2k
    display_name: u1e2k
    gravatar: 0
    email:
    web: https://github.com/u1e2k
    twitter: https://twitter.com/u1e2k
    description: "Software engineer. Nix, Linux, Web, Infrastructure."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/categories/:name/'

# Pagination
paginate: 8
paginate_path: "/page:num/"

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true
    span:
      line_numbers: false

# Exclude from build
exclude:
  - changelog.md
  - LICENSE.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - .post-template
  - docker-compose.yml
  - install.sh
  - setup.sh